<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Design | CyberVenom</title>

<style>
/* CYBER FONT */
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Share Tech Mono', monospace;
    background:radial-gradient(circle at center,#000 0%,#011010 100%);
    color:#00ffcc;
    overflow-x:hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

#particles-js{ position:fixed;top:0;left:0; width:100%;height:100%; z-index:0; }

.container{
    position:relative;
    z-index:2;
    width: 98%;
    max-width:1400px;
    text-align:center;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 10px;
}

.title{
    font-size:2.2rem;
    margin-bottom:15px;
    text-shadow:0 0 20px #00ffee;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: bold;
}

/* TABS */
.tab-container{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:15px;
}

.tab-btn{
    padding:12px 30px;
    font-size:1.2rem;
    border:2px solid #00ffd5;
    background:rgba(0,20,20,0.8);
    color:#00ffd5;
    border-radius:8px;
    cursor:pointer;
    font-family: inherit;
    text-transform: uppercase;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(0,255,213,0.1);
}

.tab-btn.active{
    background:#00ffd5;
    color:#000;
    box-shadow: 0 0 25px #00ffd5;
}

/* DIAGRAM BOX */
.diagram{
    display:none;
    width: 100%;
    height: 70vh;
    background:rgba(0,5,5,0.85);
    border:2px solid #005555;
    border-radius:15px;
    box-shadow:0 0 50px rgba(0,255,204,0.1);
    backdrop-filter:blur(10px);
    align-items: center;
    justify-content: center;
    padding: 10px;
}

.diagram.active{ display:flex; animation: fadeInBox 0.4s ease-out; }

/* SVG STYLES */
.diagram svg{
    width:100%;
    height:100%;
    /* The Neon Glow Filter is defined inside the SVG defs */
}

text {
    font-family: 'Share Tech Mono', monospace;
    fill: #e0ffff;
    text-anchor: middle;
    dominant-baseline: middle;
}

.txt-header { font-size: 24px; font-weight: bold; fill: #fff; text-shadow: 0 0 5px #00ffd5; }
.txt-body   { font-size: 18px; fill: #ccfffa; font-weight: bold; }
.txt-label  { font-size: 16px; fill: #00ffd5; font-weight: bold; background: #000; } 

/* ANIMATIONS */
.draw-path {
    stroke-dasharray: 2500;
    stroke-dashoffset: 2500;
    animation: drawLine 2.5s forwards ease-in-out;
}
.fade-in { opacity: 0; animation: fadeInEl 0.8s forwards 1.5s; }

@keyframes drawLine { to { stroke-dashoffset: 0; } }
@keyframes fadeInEl { to { opacity: 1; } }
@keyframes fadeInBox { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

/* NEXT BTN */
.nav-btn{
    position:fixed;bottom:25px;right:25px;
    background:rgba(0,0,0,0.8);
    border:2px solid #00ffd5;
    padding:15px 30px;
    color:#00ffd5;
    cursor:pointer;
    border-radius:10px;
    z-index:10;
    font-size:1.2rem;
    font-weight:bold;
    text-transform: uppercase;
}
.nav-btn:hover{ background:#00ffd5; color:#000; box-shadow: 0 0 20px #00ffd5; }

</style>
</head>

<body>

<div id="particles-js"></div>

<div class="container">

    <h1 class="title">System Design Architecture</h1>

    <div class="tab-container">
        <button class="tab-btn active" onclick="showDiagram('d1', event)">Use Case</button>
        <button class="tab-btn" onclick="showDiagram('d2', event)">Class Diagram</button>
        <button class="tab-btn" onclick="showDiagram('d3', event)">Activity Flow</button>
        <button class="tab-btn" onclick="showDiagram('d4', event)">Sequence</button>
    </div>

    <div class="diagram active" id="d1">
        <svg viewBox="0 0 1000 600">
            <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M0,0 L0,8 L8,4 z" fill="#00ffd5" />
                </marker>
            </defs>
            
            <rect x="350" y="20" width="550" height="560" rx="20" fill="none" stroke="#444" stroke-width="3" />
            <text x="625" y="60" class="txt-header" fill="#aaa">Phishing Awareness Portal</text>

            <g transform="translate(150, 300)">
                <circle cx="0" cy="0" r="35" fill="#000" stroke="#00ffd5" stroke-width="4" class="draw-path" filter="url(#glow)"/>
                <line x1="0" y1="35" x2="0" y2="100" stroke="#00ffd5" stroke-width="4" class="draw-path"/>
                <line x1="-40" y1="60" x2="40" y2="60" stroke="#00ffd5" stroke-width="4" class="draw-path"/>
                <line x1="0" y1="100" x2="-30" y2="170" stroke="#00ffd5" stroke-width="4" class="draw-path"/>
                <line x1="0" y1="100" x2="30" y2="170" stroke="#00ffd5" stroke-width="4" class="draw-path"/>
                <text x="0" y="210" class="txt-header fade-in">User</text>
            </g>

            <g class="fade-in">
                <ellipse cx="625" cy="150" rx="160" ry="50" fill="#001a1a" stroke="#00ffd5" stroke-width="3" filter="url(#glow)"/>
                <text x="625" y="150" class="txt-header">Take Awareness Quiz</text>

                <ellipse cx="625" cy="280" rx="160" ry="50" fill="#001a1a" stroke="#00ffd5" stroke-width="3" filter="url(#glow)"/>
                <text x="625" y="280" class="txt-header">Scan Suspicious Mail</text>

                <ellipse cx="625" cy="410" rx="160" ry="50" fill="#001a1a" stroke="#00ffd5" stroke-width="3" filter="url(#glow)"/>
                <text x="625" y="410" class="txt-header">Check Website URL</text>
            </g>

            <g stroke="#00ffd5" stroke-width="2" fill="none">
                <path d="M200 300 L465 150" class="draw-path"/>
                <path d="M200 300 L465 280" class="draw-path"/>
                <path d="M200 300 L465 410" class="draw-path"/>
            </g>
        </svg>
    </div>

    <div class="diagram" id="d2">
        <svg viewBox="0 0 1000 600">
            <defs>
                <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">

            </defs>

            <g transform="translate(60, 200)" class="fade-in">
                <rect width="260" height="160" fill="#001a1a" stroke="#00ffd5" stroke-width="3" rx="8" filter="url(#glow2)"/>
                <line x1="0" y1="50" x2="260" y2="50" stroke="#00ffd5" stroke-width="2"/>
                <line x1="0" y1="100" x2="260" y2="100" stroke="#00ffd5" stroke-width="2"/>
                
                <text x="130" y="30" class="txt-header">User</text>
                <text x="130" y="75" class="txt-body">- sessionID: String</text>

            <g transform="translate(450, 20)" class="fade-in">
                <rect width="300" height="160" fill="#001a1a" stroke="#00ffd5" stroke-width="3" rx="8" filter="url(#glow2)"/>
                <line x1="0" y1="50" x2="300" y2="50" stroke="#00ffd5" stroke-width="2"/>
                <line x1="0" y1="100" x2="300" y2="100" stroke="#00ffd5" stroke-width="2"/>
                
                <text x="150" y="30" class="txt-header">QuizEngine</text>

                <line x1="0" y1="50" x2="300" y2="50" stroke="#00ffd5" stroke-width="2"/>

                <text x="150" y="30" class="txt-header">URLValidator</text>
                <text x="150" y="75" class="txt-body">- blacklistDB: List</text>
                <text x="150" y="130" class="txt-body">+ checkProtocol()</text>
            </g>

            <g stroke="#00ffd5" stroke-width="3" fill="none" marker-end="url(#arrow)">
                <path d="M320 280 L385 280 L385 100 L450 100" class="draw-path"/> <path d="M320 280 L385 280 L385 300 L450 300" class="draw-path"/> <path d="M320 280 L385 280 L385 500 L450 500" class="draw-path"/> </g>
        </svg>
    </div>

    <div class="diagram" id="d3">
        <svg viewBox="0 0 1000 600">
            <circle cx="500" cy="40" r="20" fill="#00ffd5" class="fade-in"/>
            
            <g transform="translate(400, 90)" class="fade-in">
                <rect width="200" height="60" rx="30" fill="#002222" stroke="#00ffd5" stroke-width="3"/>
                <text x="100" y="30" class="txt-header">Enter URL</text>
            </g>

            <g transform="translate(500, 220)" class="fade-in">
                <polygon points="0,-50 80,0 0,50 -80,0" fill="#001a1a" stroke="#00ffd5" stroke-width="3"/>

            </g>

            <text x="360" y="210" fill="#ff4444" font-weight="bold" font-size="24">[NO]</text>

            <text x="260" y="225" fill="#ffaaaa" font-size="22" font-weight="bold">Show Error</text>

            <text x="640" y="210" fill="#00ffd5" font-weight="bold" font-size="24">[YES]</text>
            <rect x="680" y="190" width="220" height="60" rx="10" fill="#002222" stroke="#00ffd5" stroke-width="3" class="fade-in"/>
            <text x="790" y="225" class="txt-header">Check Blacklist</text>

            <rect x="680" y="280" width="220" height="60" rx="10" fill="#002222" stroke="#00ffd5" stroke-width="3" class="fade-in"/>
            <text x="790" y="315" class="txt-header">Run Heuristics</text>

            <rect x="400" y="380" width="200" height="60" rx="30" fill="#002222" stroke="#00ffd5" stroke-width="3" class="fade-in"/>

            <circle cx="500" cy="500" r="25" fill="none" stroke="#00ffd5" stroke-width="5" class="fade-in"/>
            <circle cx="500" cy="500" r="15" fill="#00ffd5" class="fade-in"/>

            <g stroke="#00ffd5" stroke-width="3" fill="none" marker-end="url(#arrow)">
                <path d="M500 60 L500 90" class="draw-path"/>
                <path d="M500 150 L500 170" class="draw-path"/>
                <path d="M420 220 L340 220" class="draw-path"/> <path d="M580 220 L680 220" class="draw-path"/> <path d="M790 250 L790 280" class="draw-path"/> 
                <path d="M790 340 L790 410 L600 410" class="draw-path"/> <path d="M260 250 L260 410 L400 410" class="draw-path"/> <path d="M500 440 L500 475" class="draw-path"/>
            </g>
        </svg>
    </div>

    <div class="diagram" id="d4">
<svg viewBox="0 0 1100 650">
        <defs>
            <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                <path d="M0,0 L0,6 L6,3 z" fill="#00ffd5" />
            </marker>
        </defs>

        <g class="fade-in">
            <rect x="100" y="20" width="180" height="60" fill="#002222" stroke="#00ffd5" stroke-width="3"/>
            <text x="190" y="55" font-size="24" text-anchor="middle" dominant-baseline="middle">User</text>
            <line x1="190" y1="80" x2="190" y2="600" stroke="#555" stroke-dasharray="10,10" stroke-width="2"/>

            <rect x="460" y="20" width="180" height="60" fill="#002222" stroke="#00ffd5" stroke-width="3"/>

            <path d="M910 310 L950 310 L950 360 L915 360" fill="none" class="draw-path"/>

        </g>

        <g stroke="#00ffd5" stroke-width="1" stroke-dasharray="12,12" marker-end="url(#arrow)">
            <line x1="910" y1="440" x2="555" y2="440" class="draw-path"/>
            <text x="730" y="420" font-size="20"text-anchor="middle">4. Return Score</text>

            <line x1="550" y1="520" x2="195" y2="520" class="draw-path"/>
            <text x="370" y="500" font-size="20" text-anchor="middle">5. Show Verdict</text>
        </g>
    </svg>
    </div>

</div>

<button class="nav-btn" onclick="window.location.href='p5.html'">Next →</button>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
particlesJS("particles-js", {
  "particles": {
    "number": { "value": 80 },
    "color": { "value": "#00ffd5" },
    "size": { "value": 3, "random": true },
    "line_linked": {
      "enable": true, "distance": 150, "color": "#00ffd5", "opacity": 0.3, "width": 1
    },
    "move": { "enable": true, "speed": 1 }
  }
});

function showDiagram(id, e){
    document.querySelectorAll(".diagram").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    e.target.classList.add("active");

    const svg = document.getElementById(id).querySelector("svg");
    const content = svg.innerHTML;
    svg.innerHTML = "";
    setTimeout(()=>{ svg.innerHTML = content; },10);
}
</script>

</body>
</html>
