<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Design | CyberVenom</title>

    <style>
        /* CYBER FONT */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: radial-gradient(circle at center, #000 0%, #011010 100%);
            color: #00ffcc;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 98%;
            max-width: 1400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }

        .title {
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #00ffee;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }

        /* TABS */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: 2px solid #00ffd5;
            background: rgba(0, 20, 20, 0.8);
            color: #00ffd5;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 213, 0.1);
        }

        .tab-btn.active {
            background: #00ffd5;
            color: #000;
            box-shadow: 0 0 25px #00ffd5;
        }

        /* DIAGRAM BOX */
        .diagram {
            display: none;
            width: 100%;
            height: 70vh;
            background: rgba(0, 5, 5, 0.85);
            border: 2px solid #005555;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.1);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .diagram.active {
            display: flex;
            animation: fadeInBox 0.4s ease-out;
        }

        /* SVG STYLES */
        .diagram svg {
            width: 100%;
            height: 100%;
        }

        text {
            font-family: 'Share Tech Mono', monospace;
            fill: #e0ffff;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .txt-header {
            font-size: 24px;
            font-weight: bold;
            fill: #fff;
            text-shadow: 0 0 5px #00ffd5;
        }

        .txt-body {
            font-size: 18px;
            fill: #ccfffa;
            font-weight: bold;
        }

        /* SPECIFIC NEON STYLES FOR USE CASE */
        .neon-fill { 
            fill: rgba(0, 20, 30, 0.8); 
            stroke: #00f3ff; 
            stroke-width: 3; 
        }

        /* ACTIVITY DIAGRAM STYLES */
        .activity-rect {
            fill: rgba(0, 10, 20, 0.9);
            stroke: #00f3ff;
            stroke-width: 2;
            rx: 10;
        }
        
        .activity-bar {
            fill: #00f3ff;
            stroke: none;
            filter: url(#cyan-glow);
        }

        .start-end-node {
            fill: #000;
            stroke: #00f3ff;
            stroke-width: 3;
        }

        /* ANIMATIONS */
        .draw-path {
            stroke-dasharray: 3000;
            stroke-dashoffset: 3000;
            animation: drawLine 3s forwards ease-in-out;
        }

        .fade-in {
            opacity: 0;
            animation: fadeInEl 0.8s forwards 1.0s; /* Delayed slightly to let lines start drawing */
        }

        @keyframes drawLine {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fadeInEl {
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInBox {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* NEXT BTN */
        .nav-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffd5;
            padding: 15px 30px;
            color: #00ffd5;
            cursor: pointer;
            border-radius: 10px;
            z-index: 10;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .nav-btn:hover {
            background: #00ffd5;
            color: #000;
            box-shadow: 0 0 20px #00ffd5;
        }
    </style>
</head>

<body>

    <div id="particles-js"></div>

    <div class="container">

        <h1 class="title">System Design Architecture</h1>

        <div class="tab-container">
            <button class="tab-btn active" onclick="showDiagram('d1', event)">Use Case</button>
            <button class="tab-btn" onclick="showDiagram('d2', event)">Class Diagram</button>
            <button class="tab-btn" onclick="showDiagram('d3', event)">Activity Flow</button>
            <button class="tab-btn" onclick="showDiagram('d4', event)">Sequence</button>
        </div>

        <!-- USE CASE DIAGRAM -->
        <div class="diagram active" id="d1">
            <svg viewBox="0 0 900 600">
                <defs>
                    <filter id="cyan-glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur" />
                        <feMerge>
                            <feMergeNode in="coloredBlur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <marker id="cyan-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#00f3ff" filter="url(#cyan-glow)"/>
                    </marker>
                </defs>

                <!-- System Boundary -->
                <rect x="180" y="50" width="680" height="500" rx="20" ry="20" fill="none" stroke="#00f3ff" stroke-width="2" class="fade-in" filter="url(#cyan-glow)"/>
                <text x="520" y="95" class="txt-header fade-in" fill="#fff">Phishing Awareness Portal</text>

                <!-- Actor: User -->
                <g transform="translate(80, 270)" class="fade-in">
                    <!-- Head -->
                    <circle cx="20" cy="0" r="15" fill="none" stroke="#00f3ff" stroke-width="3" filter="url(#cyan-glow)"/> 
                    <!-- Body Skeleton (Body, Arms, Legs) -->
                    <path d="M 20 15 L 20 60 M -5 30 L 45 30 M 20 60 L -5 95 M 20 60 L 45 95" fill="none" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" filter="url(#cyan-glow)"/>
                    <text x="20" y="135" class="txt-header">User</text>
                </g>

                <!-- Bubbles -->
                <g transform="translate(400, 160)" class="fade-in">
                    <ellipse cx="0" cy="0" rx="100" ry="40" class="neon-fill" filter="url(#cyan-glow)"/>
                    <text x="0" y="2" class="txt-body" style="font-size:16px;">Take Interactive Quiz</text>
                </g>
                <g transform="translate(730, 160)" class="fade-in">
                    <ellipse cx="0" cy="0" rx="80" ry="40" class="neon-fill" filter="url(#cyan-glow)"/>
                    <text x="0" y="2" class="txt-body" style="font-size:16px;">View Results</text>
                </g>
                <g transform="translate(400, 310)" class="fade-in">
                    <ellipse cx="0" cy="0" rx="100" ry="40" class="neon-fill" filter="url(#cyan-glow)"/>
                    <text x="0" y="2" class="txt-body" style="font-size:16px;">Spot Fake Email</text>
                </g>
                <g transform="translate(400, 460)" class="fade-in">
                    <ellipse cx="0" cy="0" rx="100" ry="40" class="neon-fill" filter="url(#cyan-glow)"/>
                    <text x="0" y="2" class="txt-body" style="font-size:16px;">Check Scam Website</text>
                </g>
                <g transform="translate(730, 385)" class="fade-in">
                    <ellipse cx="0" cy="0" rx="90" ry="40" class="neon-fill" filter="url(#cyan-glow)"/>
                    <text x="0" y="2" class="txt-body" style="font-size:16px;">Show Analysis Status</text>
                </g>

                <!-- Connectors -->
                <g stroke="#00f3ff" stroke-width="2" fill="none" filter="url(#cyan-glow)">
                    <path d="M 125 300 L 250 300" class="draw-path"/>
                    <path d="M 250 300 L 250 160 L 300 160" class="draw-path" marker-end="url(#cyan-arrow)"/>
                    <path d="M 250 300 L 300 310" class="draw-path" marker-end="url(#cyan-arrow)"/>
                    <path d="M 250 300 L 250 460 L 300 460" class="draw-path" marker-end="url(#cyan-arrow)"/>
                    <path d="M 500 160 L 650 160" class="draw-path" marker-end="url(#cyan-arrow)"/>
                    <path d="M 500 310 L 550 310 L 550 385 L 640 385" class="draw-path" marker-end="url(#cyan-arrow)"/>
                    <path d="M 500 460 L 550 460 L 550 385 L 640 385" class="draw-path"/> 
                </g>
            </svg>
        </div>

        <!-- CLASS DIAGRAM -->
        <div class="diagram" id="d2">
            <svg viewBox="0 0 1000 600">
                <defs>
                    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="2" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                        <path d="M0,0 L0,8 L8,4 z" fill="#00ffd5" />
                    </marker>
                </defs>

                <g transform="translate(60, 200)" class="fade-in">
                    <rect width="260" height="160" fill="#001a1a" stroke="#00ffd5" stroke-width="3" rx="8" filter="url(#glow2)" />
                    <line x1="0" y1="50" x2="260" y2="50" stroke="#00ffd5" stroke-width="2" />
                    <line x1="0" y1="100" x2="260" y2="100" stroke="#00ffd5" stroke-width="2" />
                    <text x="130" y="30" class="txt-header">User</text>
                    <text x="130" y="75" class="txt-body">- sessionID: String</text>
                    <text x="130" y="130" class="txt-body">+ startSession()</text>
                </g>

                <g transform="translate(450, 20)" class="fade-in">
                    <rect width="300" height="160" fill="#001a1a" stroke="#00ffd5" stroke-width="3" rx="8" filter="url(#glow2)" />
                    <line x1="0" y1="50" x2="300" y2="50" stroke="#00ffd5" stroke-width="2" />
                    <line x1="0" y1="100" x2="300" y2="100" stroke="#00ffd5" stroke-width="2" />
                    <text x="150" y="30" class="txt-header">QuizEngine</text>
                    <text x="150" y="75" class="txt-body">- questions: Array</text>
                    <text x="150" y="130" class="txt-body">+ randomize()</text>
                </g>

                <g transform="translate(450, 220)" class="fade-in">
                    <rect width="300" height="160" fill="#001a1a" stroke="#00ffd5" stroke-width="3" rx="8" filter="url(#glow2)" />
                    <line x1="0" y1="50" x2="300" y2="50" stroke="#00ffd5" stroke-width="2" />
                    <line x1="0" y1="100" x2="300" y2="100" stroke="#00ffd5" stroke-width="2" />
                    <text x="150" y="30" class="txt-header">HeuristicScanner</text>
                    <text x="150" y="75" class="txt-body">- triggerWords: Map</text>
                    <text x="150" y="130" class="txt-body">+ scanEmail(text)</text>
                </g>

                <g transform="translate(450, 420)" class="fade-in">
                    <rect width="300" height="160" fill="#001a1a" stroke="#00ffd5" stroke-width="3" rx="8" filter="url(#glow2)" />
                    <line x1="0" y1="50" x2="300" y2="50" stroke="#00ffd5" stroke-width="2" />
                    <line x1="0" y1="100" x2="300" y2="100" stroke="#00ffd5" stroke-width="2" />
                    <text x="150" y="30" class="txt-header">URLValidator</text>
                    <text x="150" y="75" class="txt-body">- blacklistDB: List</text>
                    <text x="150" y="130" class="txt-body">+ checkProtocol()</text>
                </g>

                <g stroke="#00ffd5" stroke-width="3" fill="none" marker-end="url(#arrow)">
                    <path d="M320 280 L385 280 L385 100 L450 100" class="draw-path" />
                    <path d="M320 280 L385 280 L385 300 L450 300" class="draw-path" />
                    <path d="M320 280 L385 280 L385 500 L450 500" class="draw-path" />
                </g>
            </svg>
        </div>

        <!-- ACTIVITY DIAGRAM -->
        <div class="diagram" id="d3">
            <svg viewBox="0 0 1200 850">
                <defs>
                    <marker id="act-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#00f3ff" filter="url(#cyan-glow)"/>
                    </marker>
                </defs>

                <!-- Start Node -->
                <circle cx="50" cy="350" r="18" class="start-end-node fade-in" />

                <!-- PATH 1: Top (Quiz) -->
                <g transform="translate(150, 50)" class="fade-in">
                    <rect width="190" height="60" class="activity-rect"/>
                    <text x="90" y="30" class="txt-body" style="font-size:16px;">Take Interactive Quiz</text>
                </g>
                <g transform="translate(400, 50)" class="fade-in">
                    <rect width="180" height="60" class="activity-rect"/>
                    <text x="90" y="30" class="txt-body" style="font-size:16px;">Evaluate Results</text>
                </g>

                <!-- PATH 2: Middle (Email) -->
                <g transform="translate(150, 320)" class="fade-in">
                    <rect width="180" height="60" class="activity-rect"/>
                    <text x="90" y="30" class="txt-body" style="font-size:16px;">Spot Fake Email</text>
                </g>
                
                <!-- Fork Vertical Bar -->
                <rect x="360" y="220" width="10" height="240" rx="5" class="activity-bar fade-in" />

                <!-- Sub-path A (Address) -->
                <g transform="translate(420, 220)" class="fade-in">
                    <rect width="180" height="60" class="activity-rect"/>
                    <text x="90" y="20" class="txt-body" style="font-size:14px;">Check Email</text>
                    <text x="90" y="45" class="txt-body" style="font-size:14px;">Address</text>
                </g>
                <g transform="translate(650, 220)" class="fade-in">
                    <rect width="200" height="60" class="activity-rect"/>
                    <text x="100" y="20" class="txt-body" style="font-size:14px;">Check Domain</text>
                    <text x="100" y="45" class="txt-body" style="font-size:14px;">From Database</text>
                </g>

                <!-- Sub-path B (Content) -->
                <g transform="translate(420, 400)" class="fade-in">
                    <rect width="180" height="60" class="activity-rect"/>
                    <text x="90" y="20" class="txt-body" style="font-size:14px;">Check Email</text>
                    <text x="90" y="45" class="txt-body" style="font-size:14px;">Content</text>
                </g>
                <g transform="translate(650, 400)" class="fade-in">
                    <rect width="200" height="60" class="activity-rect"/>
                    <text x="100" y="20" class="txt-body" style="font-size:14px;">Check for Triggers</text>
                    <text x="100" y="45" class="txt-body" style="font-size:14px;">& Risk Words</text>
                </g>

                <!-- Join Vertical Bar -->
                <rect x="880" y="220" width="10" height="240" rx="5" class="activity-bar fade-in" />


                <!-- PATH 3: Bottom (Web) -->
                <g transform="translate(150, 580)" class="fade-in">
                    <rect width="180" height="60" class="activity-rect"/>
                    <text x="90" y="20" class="txt-body" style="font-size:14px;">Check Scam</text>
                    <text x="90" y="45" class="txt-body" style="font-size:14px;">Websites</text>
                </g>
                <g transform="translate(420, 580)" class="fade-in">
                    <rect width="180" height="60" class="activity-rect"/>
                    <text x="90" y="20" class="txt-body" style="font-size:14px;">Check TCP/SSL</text>
                    <text x="90" y="45" class="txt-body" style="font-size:14px;">Certification</text>
                </g>
                <g transform="translate(650, 580)" class="fade-in">
                    <rect width="180" height="60" class="activity-rect"/>
                    <text x="90" y="20" class="txt-body" style="font-size:14px;">Blacklist Check</text>
                    <text x="90" y="45" class="txt-body" style="font-size:14px;">For Address</text>
                </g>


                <!-- FINAL MERGE BAR -->
                <rect x="950" y="650" width="140" height="10" rx="5" class="activity-bar fade-in" />


                <!-- RESULT & END -->
                <g transform="translate(930, 700)" class="fade-in">
                    <rect width="180" height="60" class="activity-rect"/>
                    <text x="90" y="30" class="txt-body" style="font-size:18px;">Show Result</text>
                </g>
                <g transform="translate(1020, 800)" class="fade-in">
                    <circle cx="0" cy="0" r="20" stroke="#00f3ff" stroke-width="2" fill="none"/>
                    <circle cx="0" cy="0" r="12" fill="#00f3ff"/>
                </g>

                <!-- CONNECTORS (Manhattan Style) -->
                <g stroke="#00f3ff" stroke-width="2" fill="none" filter="url(#cyan-glow)">
                    <!-- Start -> Split -->
                    <path d="M 68 350 L 100 350" class="draw-path" />

                    <!-- Split to Top Path -->
                    <path d="M 100 350 L 100 80 L 150 80" class="draw-path" marker-end="url(#act-arrow)" />
                    <path d="M 330 80 L 400 80" class="draw-path" marker-end="url(#act-arrow)" />
                    <!-- Top Path to Final Merge -->
                    <path d="M 580 80 L 1020 80 L 1020 650" class="draw-path" marker-end="url(#act-arrow)" />

                    <!-- Split to Middle Path -->
                    <path d="M 100 350 L 150 350" class="draw-path" marker-end="url(#act-arrow)" />
                    <path d="M 330 350 L 360 350" class="draw-path"/> <!-- To Fork -->

                    <!-- Middle Fork Top Subpath -->
                    <path d="M 365 250 L 380 250 L 380 250 L 420 250" class="draw-path" marker-end="url(#act-arrow)" />
                    <path d="M 600 250 L 650 250" class="draw-path" marker-end="url(#act-arrow)" />
                    <path d="M 850 250 L 880 250" class="draw-path" marker-end="url(#act-arrow)" />

                    <!-- Middle Fork Bottom Subpath -->
                    <path d="M 365 430 L 380 430 L 380 430 L 420 430" class="draw-path" marker-end="url(#act-arrow)" />
                    <path d="M 600 430 L 650 430" class="draw-path" marker-end="url(#act-arrow)" />
                    <path d="M 850 430 L 880 430" class="draw-path" marker-end="url(#act-arrow)" />

                    <!-- Middle Join to Final Merge -->
                    <path d="M 885 340 L 980 340 L 980 650" class="draw-path" marker-end="url(#act-arrow)" />

                    <!-- Split to Bottom Path -->
                    <path d="M 100 350 L 100 610 L 150 610" class="draw-path" marker-end="url(#act-arrow)" />
                    <path d="M 330 610 L 420 610" class="draw-path" marker-end="url(#act-arrow)" />
                    <path d="M 600 610 L 650 610" class="draw-path" marker-end="url(#act-arrow)" />
                    <!-- Bottom Path to Final Merge -->
                    <path d="M 830 610 L 960 610 L 960 650" class="draw-path" marker-end="url(#act-arrow)" />

                    <!-- Final Merge to Result -->
                    <path d="M 1020 660 L 1020 700" class="draw-path" marker-end="url(#act-arrow)" />
                    
                    <!-- Result to End -->
                    <path d="M 1020 760 L 1020 780" class="draw-path" marker-end="url(#act-arrow)" />
                </g>

            </svg>
        </div>

        <!-- SEQUENCE DIAGRAM (UPDATED WITH SHARP TEXT) -->
        <div class="diagram" id="d4">
            <svg viewBox="0 0 1000 650">
                <defs>
                    <marker id="seq-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#00f3ff" filter="url(#cyan-glow)"/>
                    </marker>
                </defs>

                <!-- LIFELINES -->
                <!-- User -->
                <g class="fade-in">
                    <rect x="50" y="20" width="160" height="50" fill="none" stroke="#00f3ff" stroke-width="2" rx="5"/>
                    <text x="130" y="50" class="txt-header">User</text>
                    <line x1="130" y1="70" x2="130" y2="600" stroke="#f0e68c" stroke-width="3" />
                    <rect x="50" y="600" width="160" height="50" fill="none" stroke="#00f3ff" stroke-width="2" rx="5"/>
                    <text x="130" y="630" class="txt-header">User</text>
                </g>

                <!-- Interface -->
                <g class="fade-in">
                    <rect x="420" y="20" width="160" height="50" fill="none" stroke="#00f3ff" stroke-width="2" rx="5"/>
                    <text x="500" y="50" class="txt-header">Interface</text>
                    <line x1="500" y1="70" x2="500" y2="600" stroke="#f0e68c" stroke-width="3" />
                    <rect x="420" y="600" width="160" height="50" fill="none" stroke="#00f3ff" stroke-width="2" rx="5"/>
                    <text x="500" y="630" class="txt-header">Interface</text>
                </g>

                <!-- Logic -->
                <g class="fade-in">
                    <rect x="790" y="20" width="160" height="50" fill="none" stroke="#00f3ff" stroke-width="2" rx="5"/>
                    <text x="870" y="50" class="txt-header">Logic</text>
                    <line x1="870" y1="70" x2="870" y2="600" stroke="#f0e68c" stroke-width="3" />
                    <rect x="790" y="600" width="160" height="50" fill="none" stroke="#00f3ff" stroke-width="2" rx="5"/>
                    <text x="870" y="630" class="txt-header">Logic</text>
                </g>


                <!-- MESSAGES LINES & ARROWS (GLOW + STROKE) -->
                <g stroke="#00f3ff" stroke-width="3" fill="none" filter="url(#cyan-glow)">
                    
                    <!-- 1. User -> Interface -->
                    <line x1="130" y1="130" x2="495" y2="130" class="draw-path" style="stroke: #000; stroke-width: 4px;" /> <!-- Background Mask for line overlap -->
                    <line x1="130" y1="130" x2="495" y2="130" class="draw-path" marker-end="url(#seq-arrow)" />

                    <!-- 2. Interface -> Logic -->
                    <line x1="500" y1="170" x2="865" y2="170" class="draw-path" style="animation-delay: 1s; stroke: #000; stroke-width: 4px;"/>
                    <line x1="500" y1="170" x2="865" y2="170" class="draw-path" style="animation-delay: 1s;" marker-end="url(#seq-arrow)" />

                    <!-- 3. Loop Block (Logic Self) -->
                    <path d="M 875 235 L 930 235 L 930 360 L 875 360" class="draw-path" style="stroke: #000; stroke-width: 5px; animation-delay: 2s;"/>
                    <path d="M 875 235 L 930 235 L 930 360 L 875 360" class="draw-path" style="stroke-width: 3px; animation-delay: 2s;"/>

                    <!-- 4. Logic -> Interface (Processing) -->
                    <line x1="870" y1="430" x2="505" y2="430" class="draw-path" style="animation-delay: 3s; stroke: #000; stroke-width: 4px;"/>
                    <line x1="870" y1="430" x2="505" y2="430" class="draw-path" style="animation-delay: 3s;" marker-end="url(#seq-arrow)" />

                    <!-- 5. Interface -> User (Display) -->
                    <line x1="500" y1="470" x2="135" y2="470" class="draw-path" style="animation-delay: 3.5s; stroke: #000; stroke-width: 4px;"/>

    <script>
        window.addEventListener('load', function() {
            if (typeof particlesJS !== 'undefined') {
                particlesJS("particles-js", {
                    "particles": {
                        "number": { "value": 80 },
                        "color": { "value": "#00ffd5" },
                        "size": { "value": 3, "random": true },
                        "line_linked": {
                            "enable": true, "distance": 150, "color": "#00ffd5", "opacity": 0.3, "width": 1
                        },
                        "move": { "enable": true, "speed": 1 }
                    }
                });
            } else {
                console.log("Particles.js library not loaded.");
            }
        });

        function showDiagram(id, e) {
            document.querySelectorAll(".diagram").forEach(d => d.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(id).classList.add("active");
            e.target.classList.add("active");

            const svg = document.getElementById(id).querySelector("svg");
            // Trigger animation restart
            const content = svg.innerHTML;
            svg.innerHTML = "";
            setTimeout(() => { svg.innerHTML = content; }, 10);
        }
    </script>
